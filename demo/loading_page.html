<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo loading - vo_web</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #f5f5f7; }
  header { background: #c00; color: #fff; padding: 14px 24px; }
  main { padding: 24px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .skeleton { display: block; height: 18px; border-radius: 6px; margin: 12px 0;
    background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
    background-size: 400% 100%; animation: sk 1.2s infinite linear; }
  @keyframes sk { 0% {background-position: 100% 0} 100% {background-position: 0 0} }
  .card { background: #fff; border-radius: 10px; padding: 20px; max-width: 560px; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid #888; background: #fff; }
  #content { display: none; }
</style>
</head>
<body>
<header><strong>vo_web demo</strong></header>
<main>
  <h1>Buy demo product</h1>
  <!-- LiveAnnouncer equivalente: role=status oculto que se rellena durante la carga -->
  <span id="announcer" class="sr-only" role="status" aria-live="polite" data-testid="screen-reader"></span>

  <div class="card">
    <div id="skeleton-zone">
      <span class="skeleton" style="width:60%"></span>
      <span class="skeleton" style="width:85%"></span>
      <span class="skeleton" style="width:40%"></span>
      <span class="skeleton" style="width:70%"></span>
    </div>
    <div id="content">
      <h2>Order summary</h2>
      <p>Product: Demo ETF · Amount: 100.00 EUR</p>
      <button>Confirm order</button>
      <button>Cancel</button>
    </div>
  </div>
</main>
<script>
  // Simula la carga: anuncio "Loading ..." en la live region, skeleton 6s,
  // luego contenido y reset del announcer a U+200B (comportamiento del LiveAnnouncer real).
  const params = new URLSearchParams(location.search);
  const announce = params.get('announce') !== '0';
  const loadMs = parseInt(params.get('load_ms') || '6000', 10);
  const ann = document.getElementById('announcer');
  setTimeout(() => {
    if (announce) ann.textContent = 'Loading Buy demo product';
  }, 400);
  setTimeout(() => {
    document.getElementById('skeleton-zone').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    ann.textContent = '​'; // reset a U+200B
  }, loadMs);
</script>
</body>
</html>
